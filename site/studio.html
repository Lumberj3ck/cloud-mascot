<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud mascot studio</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <style>
    :root { --bg: #fdf6f1; --ink: #4a3d4f; --chip: #ffffffcc; --chip-line: #e9dcef; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; overflow: hidden; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-wrap: wrap;
      gap: 6px; justify-content: center; max-width: calc(100% - 32px); padding: 8px; border-radius: 18px;
      background: var(--chip); border: 1px solid var(--chip-line); backdrop-filter: blur(10px); }
    .panel button { appearance: none; border: 0; border-radius: 12px; padding: 7px 12px; background: transparent;
      color: inherit; font: inherit; cursor: pointer; }
    .panel button:hover { background: #f3e9f7; }
    .panel .sep { width: 1px; background: var(--chip-line); margin: 2px 4px; }
    .panel.top { top: 16px; bottom: auto; }
    .lab { flex-direction: column; align-items: stretch; gap: 2px; padding: 6px 8px; }
    .lab nav { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
    .lab .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .55; width: 44px; }
    .lab button { padding: 4px 9px; font-size: 13px; }
    body.shot .panel { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Cloud mascot"></canvas>
  <nav class="panel" aria-label="Views">
    <button data-view="hero">Hero</button>
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="back">Back</button>
    <button data-view="top">Top</button>
    <button data-view="threequarter">¾</button>
    <button data-view="face">Face</button>
  </nav>
  <div class="panel top lab">
    <nav id="moods" aria-label="Moods"><span class="lbl">mood</span></nav>
    <nav id="clips" aria-label="Clips"><span class="lbl">clip</span></nav>
    <nav id="expressions" aria-label="Expressions"><span class="lbl">face</span></nav>
  </div>
  <script type="module" src="js/studio.js"></script>
</body>
</html>
