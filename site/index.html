<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#3b2c63">
  <meta name="description" content="Nimbus: give each planet a few small daily tasks and watch your little world grow.">
  <title>Nimbus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 48'%3E%3Cpath d='M14.5 44h35a12.5 12.5 0 0 0 3.3-24.6A17.5 17.5 0 0 0 19.6 15 14.5 14.5 0 0 0 14.5 44z' fill='%23b79be0'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/cloudscape-v1.jpg" as="image">
  <link rel="stylesheet" href="app.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body class="booting">
  <canvas id="scene" aria-label="Nimbus and its planets. Drag to look around."></canvas>
  <div id="labels" class="labels"></div>
  <div id="bubble" class="bubble" role="status" aria-live="polite"></div>

  <header class="topbar ui">
    <div class="brand" id="brand"></div>
    <div class="top-actions">
      <button class="pill dust" id="dustBtn" aria-label="Stardust, open the wardrobe"></button>
      <div class="pill streak" id="streakPill"></div>
      <button class="iconbtn" id="wardrobeBtn" aria-label="Wardrobe"></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
  </header>

  <aside class="sheet today ui" id="today" aria-label="Today"></aside>
  <aside class="sheet side ui" id="planetSheet" aria-label="Planet" hidden></aside>
  <aside class="sheet side ui" id="shopSheet" aria-label="Wardrobe" hidden></aside>

  <div class="menu" id="menu" role="menu" hidden></div>
  <section class="onboard" id="onboard" aria-label="Welcome" hidden></section>
  <dialog class="dialog" id="dialog"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="splash" id="splash" role="status" aria-live="polite">
    <div class="splash-inner">
      <svg class="mark" viewBox="0 0 64 48" aria-hidden="true"><path d="M14.5 44h35a12.5 12.5 0 0 0 3.3-24.6A17.5 17.5 0 0 0 19.6 15 14.5 14.5 0 0 0 14.5 44z" fill="#fffafd"/><ellipse cx="25.5" cy="29" rx="2.4" ry="3" fill="#2c2240"/><ellipse cx="38.5" cy="29" rx="2.4" ry="3" fill="#2c2240"/><path d="M29.4 33.4q2.6 2.4 5.2 0" fill="none" stroke="#2c2240" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="20" cy="34" rx="3.2" ry="2" fill="#f7a8c8" opacity=".7"/><ellipse cx="44" cy="34" rx="3.2" ry="2" fill="#f7a8c8" opacity=".7"/></svg>
      <h1>Nimbus</h1>
      <div class="splash-bar" aria-hidden="true"><i id="splashFill"></i></div>
      <p id="splashText">Gathering clouds</p>
    </div>
  </div>
  <noscript><div class="splash"><div class="splash-inner"><h1>Nimbus</h1><p>Nimbus needs JavaScript to draw its planets.</p></div></div></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
